name: Curriculum and assessment tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m compileall -q assess.py tests
      - name: Test lessons and assessment
        run: python -m unittest discover -s tests -v
      - name: Validate sample assessment
        run: python assess.py examples/team-assessment.json
